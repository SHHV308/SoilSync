spring.application.name=SoilSync
spring.profiles.default=local
server.port=${PORT:8080}
server.forward-headers-strategy=framework

soilsync.public-base-url=https://soilsync.in
soilsync.privacy.consent-version=v1
soilsync.llm.base-url=${SOILSYNC_LLM_BASE_URL:}
soilsync.llm.model=${SOILSYNC_LLM_MODEL:}
soilsync.llm.api-key=${SOILSYNC_LLM_API_KEY:}
soilsync.assistant.rate-limit-per-minute=${SOILSYNC_ASSISTANT_RATE_LIMIT_PER_MINUTE:10}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
