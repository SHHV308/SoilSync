services:
  - type: web
    name: soilsync
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SOILSYNC_LLM_BASE_URL
        sync: false
      - key: SOILSYNC_LLM_MODEL
        sync: false
      - key: SOILSYNC_LLM_API_KEY
        sync: false
